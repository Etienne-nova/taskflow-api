[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    "*/migrations/*",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.ruff.lint.per-file-ignores]
"config/settings/development.py" = ["F403"]
"config/settings/production.py" = ["F403"]


[tool.black]
line-length = 88
target-version = ["py312"]
exclude = '''
/(
    migrations
)/
'''

[tool.isort]
profile = "black"
